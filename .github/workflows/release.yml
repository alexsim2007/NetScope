name: Подготовить черновик релиза
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Существующий тег релиза (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Проверить тег и версии
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/version.mjs --check-tag "$RELEASE_TAG"
        shell: bash
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - name: Проверить подпись приложения и образ macOS
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict target/${{ matrix.target }}/release/bundle/macos/NetScope.app
          hdiutil verify target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      - run: node scripts/prepare-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          path: incoming
          merge-multiple: true
      - name: Создать или обновить только черновик
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          node scripts/version.mjs --check-tag "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!require("./release-state.json").isDraft) throw new Error("Опубликованный релиз не изменяем автоматически")'
            gh release upload "$RELEASE_TAG" incoming/* --clobber
          else
            gh release create "$RELEASE_TAG" incoming/* --verify-tag --draft --prerelease --title "NetScope" --notes-file docs/release-notes.md
          fi
